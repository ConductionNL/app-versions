name: Beta Release

on:
  push:
    branches: [beta]

jobs:
  release:
    uses: ConductionNL/.github/.github/workflows/release-beta.yml@main
    with:
      # app_versions, with an underscore. It must match <id> in
      # appinfo/info.xml, because the packaged directory is named after it
      # and Nextcloud refuses an app whose folder does not match its id.
      # This said app-versions, so the tarball would have been unusable.
      app-name: app_versions
      # The frontend is Vite 7 and package.json declares engines.node ^24.
      # The shared workflow defaults to Node 18, on which the build fails,
      # which is why this app has never produced a release.
      node-version: "24"
    secrets: inherit
