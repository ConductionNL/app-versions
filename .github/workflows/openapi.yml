name: OpenAPI

# WAS `on: pull_request`, and it has NEVER ONCE PASSED — not on this PR, not on
# development, not on any run in the history. It cannot pass, for a reason that
# has nothing to do with this repository's code:
#
#   PHP Fatal error: license: Unable to convert EUPL-1.2 to SPDX identifier
#
# nextcloud/openapi-extractor maps licences through a hardcoded match() in
# src/Helpers.php that accepts agpl / mit / mpl / apache / gpl3 and five SPDX
# spellings, and calls Logger::panic() — a fatal, not a warning — on anything
# else. EUPL-1.2 is a perfectly valid SPDX identifier; the tool's list is just
# incomplete. Checked against the extractor's `main` on 2026-08-18: still
# missing. Every Conduction app is EUPL-1.2, so no version of this can pass
# while the licence is stated truthfully.
#
# The two dishonest ways out were both rejected: mislabelling the licence to
# suit a tool, and marking the step continue-on-error so a broken job reports
# green. Neither is a fix; the second is worse than the red.
#
# So it runs on demand only. Nothing is lost by that — the job has never
# produced its artefacts either ("These files don't exist:
# src/types/openapi/openapi*.ts"). The real fix is upstream: add EUPL-1.2 to
# that match(). Restore `pull_request` here the moment it lands.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  openapi:
    runs-on: ubuntu-latest
    # Observed fleet-wide: max 1.0 min (n=5). Deliberately loose.
    timeout-minutes: 20

    if: ${{ github.repository_owner != 'nextcloud-gmbh' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get php version
        id: php_versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2

      - name: Set up php
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: ${{ steps.php_versions.outputs.php-available }}
          extensions: xml
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Typescript OpenApi types
        id: check_typescript_openapi
        uses: andstor/file-existence-action@076e0072799f4942c8bc574a82233e1e4d13e9d6 # v3.0.0
        with:
          files: "src/types/openapi/openapi*.ts"

      - name: Read package.json node and npm engines version
        if: steps.check_typescript_openapi.outputs.files_exists == 'true'
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: node_versions
        # Continue if no package.json
        continue-on-error: true
        with:
          fallbackNode: '^24'
          fallbackNpm: '^11.3'

      - name: Set up node ${{ steps.node_versions.outputs.nodeVersion }}
        if: ${{ steps.node_versions.outputs.nodeVersion }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ steps.node_versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.node_versions.outputs.npmVersion }}
        if: ${{ steps.node_versions.outputs.nodeVersion }}
        run: npm i -g 'npm@${{ steps.node_versions.outputs.npmVersion }}'

      - name: Install dependencies
        if: ${{ steps.node_versions.outputs.nodeVersion }}
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          npm ci

      - name: Set up dependencies
        run: composer i

      - name: Regenerate OpenAPI
        run: composer run openapi

      - name: Check openapi*.json and typescript changes
        run: |
          bash -c "[[ ! \"`git status --porcelain `\" ]] || (echo 'Please run \"composer run openapi\" and commit the openapi*.json files and (if applicable) src/types/openapi/openapi*.ts, see the section \"Show changes on failure\" for details' && exit 1)"

      - name: Show changes on failure
        if: failure()
        run: |
          git status
          git --no-pager diff
          exit 1 # make it red to grab attention
